{{define "modals/inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" :dialog-style="{ top: '20px' }"
    @ok="inModal.ok" :confirm-loading="inModal.confirmLoading || (inModal.inbound.isNative && inModal.inbound.settings.generating)" :closable="true" :mask-closable="false"
    :ok-button-props="{ props: { disabled: inModal.inbound.isNative && (inModal.inbound.settings.generating || inModal.inbound.settings.modeDefaultsPending) } }"
    :class="themeSwitcher.currentTheme" :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>
    // Make inModal globally available to ensure it works with any base path
    const inModal = (window.inModal = {
        title: "",
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        nativeProfileToken: 0,
        nativeProfileController: null,
        nativeProfileSettings: null,
        ok() {
            if (inModal.inbound.isNative) {
                if (inModal.inbound.settings.generating || inModal.inbound.settings.modeDefaultsPending) return;
                try { inModal.inbound.settings.syncGeneratedClientBindings(); }
                catch (error) { app.$message.error(error.message); return; }
            }
            const compatibilityErrors = Inbound.compatibilityErrors(inModal.inbound.protocol, inModal.inbound.clients, inModal.inbound.method);
            if (compatibilityErrors.length) {
                app.$message.error(compatibilityErrors.join("; "));
                return;
            }
            if (inModal.inbound.isNative && inModal.inbound.settings.validationErrors.length) {
                app.$message.error(inModal.inbound.settings.validationErrors.join("; "));
                return;
            }
            if (inModal.inbound.protocol === Protocols.ANYTLS && (inModal.inbound.stream.network !== "tcp" || inModal.inbound.stream.security !== "tls")) {
                app.$message.error("AnyTLS inbound requires TCP with TLS.");
                return;
            }
            if (inModal.inbound.protocol === Protocols.ANYTLS && !inModal.inbound.stream.tls.certs.some(cert => (cert.cert && cert.key) || (cert.certFile && cert.keyFile))) {
                app.$message.error("AnyTLS certificate and private key are required.");
                return;
            }
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({
            title = "",
            okText = '{{ i18n "sure" }}',
            inbound = null,
            dbInbound = null,
            confirm = (inbound, dbInbound) => { },
            isEdit = false,
        }) {
            this.cancelNativeDefaults();
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            // Always ensure testseed is initialized for VLESS protocol (even if vision flow is not set yet)
            // This ensures Vue reactivity works properly
            if (this.inbound.protocol === Protocols.VLESS && this.inbound.settings) {
                if (
                    !this.inbound.settings.testseed ||
                    !Array.isArray(this.inbound.settings.testseed) ||
                    this.inbound.settings.testseed.length < 4
                ) {
                    // Create a new array to ensure Vue reactivity
                    this.inbound.settings.testseed = [900, 500, 900, 256].slice();
                }
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.confirm = confirm;
            this.visible = true;
            this.isEdit = isEdit;
            if (this.inbound.isNative) this.inbound.settings.rememberClientBindings();
        },
        cancelNativeDefaults() {
            if (this.nativeProfileController) this.nativeProfileController.abort();
            this.nativeProfileController = null;
            this.nativeProfileSettings = null;
            this.nativeProfileToken++;
        },
        async initializeNativeDefaults(retry = false) {
            const inbound = this.inbound;
            const settings = inbound.settings;
            if (this.nativeProfileController && this.nativeProfileSettings !== settings) this.cancelNativeDefaults();
            if (!this.visible || this.isEdit || !inbound.isNative || !settings.needsProfile || settings.generating || (settings.profileAttempted && !retry)) return false;
            if (!settings.profileSnapshot) settings.profileSnapshot = JSON.stringify(inbound.toJson());
            if (settings.profileIdentityError) return false;
            this.cancelNativeDefaults();
            const controller = new AbortController();
            const token = this.nativeProfileToken;
            this.nativeProfileController = controller;
            this.nativeProfileSettings = settings;
            settings.profileAttempted = true;
            settings.generating = true;
            settings.generationError = '';
            settings.generationNotice = '';
            const timeout = setTimeout(() => controller.abort(), 30000);
            try {
                const request = {
                    kind: 'inbound-profile', protocol: inbound.protocol,
                    email: settings.clients[0]?.email || '',
                };
                if (['anytls', 'openvpn'].includes(inbound.protocol) && settings.data.clientExport?.serverName) request.serverName = settings.data.clientExport.serverName;
                if (inbound.protocol === Protocols.ORBIT && settings.data.clientExport?.address) request.serverAddress = settings.data.clientExport.address;
                if (inbound.protocol === Protocols.DNSTT && settings.data.domain) request.domain = settings.data.domain;
                if (inbound.protocol === Protocols.SHADOWTLS && settings.data.handshake?.address) request.handshakeAddress = settings.data.handshake.address;
                const generated = await Inbound.NativeSettings.requestCredentials(request, controller.signal);
                if (this.nativeProfileToken !== token || this.inbound !== inbound || this.inbound.settings !== settings || !this.visible || this.isEdit) return false;
                const identity = Inbound.NativeSettings.canonicalServerIdentity;
                if ((inbound.protocol === Protocols.ANYTLS && identity(request.serverName) !== identity(settings.data.clientExport?.serverName)) || (inbound.protocol === Protocols.ORBIT && identity(request.serverAddress) !== identity(settings.data.clientExport?.address))) throw new Error('Server identity changed. Your entries were kept. Generate again.');
                const before = JSON.parse(settings.profileSnapshot);
                const profile = Inbound.NativeSettings.mergeGeneratedProfile(inbound.protocol, generated, before, inbound.toJson());
                const supplied = Inbound.fromJson({...before, settings: generated.settings, streamSettings: generated.streamSettings || before.streamSettings});
                if (supplied.settings.generatedProfileErrors.length) throw new Error('The generated settings were incomplete. Try again.');
                if (inbound.protocol === Protocols.ANYTLS && (supplied.stream.network !== 'tcp' || supplied.stream.security !== 'tls' || !supplied.stream.tls.certs.some(cert => cert.cert && cert.key))) throw new Error('The generated certificate was incomplete. Try again.');
                const next = Inbound.fromJson(profile);
                if (generated.publicKey) next.settings.generatedPublicKey = generated.publicKey;
                next.settings.generationNotice = next.settings.validationErrors.length ? 'Credentials are ready. Complete the required fields.' : 'Settings are ready.';
                next.settings.rememberClientBindings();
                next.settings.modeDefaultsPending = true;
                this.inbound = next;
                return true;
            } catch (error) {
                if (this.nativeProfileToken === token && this.inbound === inbound && this.inbound.settings === settings && this.visible) settings.generationError = error.name === 'AbortError' ? 'Generation timed out. Try again.' : error.message || 'Could not generate settings.';
                return false;
            } finally {
                clearTimeout(timeout);
                settings.generating = false;
                if (this.nativeProfileController === controller) {
                    this.nativeProfileController = null;
                    this.nativeProfileSettings = null;
                }
            }
        },
        async initializeNativeModeDefaults() {
            const settings = this.inbound.settings;
            if (!this.visible || !this.inbound.isNative || !settings.modeDefaultsPending || settings.generating) return false;
            settings.modeDefaultsPending = false;
            settings.modeDefaultsFailed = false;
            const ready = await settings.fillMissingModeDefaults();
            if (this.inbound.settings === settings) settings.modeDefaultsFailed = !ready;
            return ready;
        },
        retryNativeModeDefaults() {
            if (!this.inbound.isNative) return;
            this.inbound.settings.modeDefaultsPending = true;
            return this.initializeNativeModeDefaults();
        },
        close() {
            inModal.cancelNativeDefaults();
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading = true) {
            inModal.confirmLoading = loading;
        },
        // Vision Seed methods - always available regardless of Vue context
        updateTestseed(index, value) {
            // Use inModal.inbound explicitly to ensure correct context
            if (!inModal.inbound || !inModal.inbound.settings) return;
            // Ensure testseed is initialized
            if (
                !inModal.inbound.settings.testseed ||
                !Array.isArray(inModal.inbound.settings.testseed)
            ) {
                inModal.inbound.settings.testseed = [900, 500, 900, 256];
            }
            // Ensure array has enough elements
            while (inModal.inbound.settings.testseed.length <= index) {
                inModal.inbound.settings.testseed.push(0);
            }
            // Update value
            inModal.inbound.settings.testseed[index] = value;
        },
        setRandomTestseed() {
            // Use inModal.inbound explicitly to ensure correct context
            if (!inModal.inbound || !inModal.inbound.settings) return;
            // Ensure testseed is initialized
            if (
                !inModal.inbound.settings.testseed ||
                !Array.isArray(inModal.inbound.settings.testseed) ||
                inModal.inbound.settings.testseed.length < 4
            ) {
                inModal.inbound.settings.testseed = [900, 500, 900, 256].slice();
            }
            // Create new array with random values
            inModal.inbound.settings.testseed = [
                Math.floor(Math.random() * 1000),
                Math.floor(Math.random() * 1000),
                Math.floor(Math.random() * 1000),
                Math.floor(Math.random() * 1000),
            ];
        },
        resetTestseed() {
            // Use inModal.inbound explicitly to ensure correct context
            if (!inModal.inbound || !inModal.inbound.settings) return;
            // Reset testseed to default values
            inModal.inbound.settings.testseed = [900, 500, 900, 256].slice();
        },
    });

    // Store Vue instance globally to ensure methods are always accessible
    let inboundModalVueInstance = null;

    inboundModalVueInstance = new Vue({
        delimiters: ["[[", "]]"],
        el: "#inbound-modal",
        data: {
            inModal: inModal,
            delayedStart: false,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            },
            get isEdit() {
                return inModal.isEdit;
            },
            get client() {
                return inModal.inbound &&
                    inModal.inbound.clients &&
                    inModal.inbound.clients.length > 0
                    ? inModal.inbound.clients[0]
                    : null;
            },
            get datepicker() {
                return app.datepicker;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0
                    ? this.client.expiryTime / -86400000
                    : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
            get externalProxy() {
                return this.inbound.stream.externalProxy.length > 0;
            },
            set externalProxy(value) {
                if (value) {
                    inModal.inbound.stream.externalProxy = [
                        {
                            forceTls: "same",
                            dest: window.location.hostname,
                            port: inModal.inbound.port,
                            remark: "",
                        },
                    ];
                } else {
                    inModal.inbound.stream.externalProxy = [];
                }
            },
        },
        watch: {
            "inModal.inbound.settings"() {
                inModal.initializeNativeDefaults();
            },
            "inModal.visible"(visible) {
                if (!visible) inModal.cancelNativeDefaults();
                else inModal.initializeNativeDefaults();
            },
            "inModal.inbound.settings.modeDefaultsPending"(pending) {
                if (pending) inModal.initializeNativeModeDefaults();
            },
            "inModal.inbound.settings.generating"(generating) {
                if (!generating) inModal.initializeNativeModeDefaults();
            },
            "inModal.inbound.stream.security"(newVal, oldVal) {
                // Clear flow when security changes from reality/tls to none
                if (
                    inModal.inbound.protocol == Protocols.VLESS &&
                    !inModal.inbound.canEnableTlsFlow()
                ) {
                    inModal.inbound.settings.vlesses.forEach((client) => {
                        client.flow = "";
                    });
                }
            },
            // Ensure testseed is always initialized when vision flow is enabled
            "inModal.inbound.settings.vlesses": {
                handler() {
                    if (
                        inModal.inbound.protocol === Protocols.VLESS &&
                        inModal.inbound.settings &&
                        inModal.inbound.settings.vlesses
                    ) {
                        const hasVisionFlow = inModal.inbound.settings.vlesses.some(
                            (c) =>
                                c.flow === "xtls-rprx-vision" ||
                                c.flow === "xtls-rprx-vision-udp443",
                        );
                        if (
                            hasVisionFlow &&
                            (!inModal.inbound.settings.testseed ||
                                !Array.isArray(inModal.inbound.settings.testseed) ||
                                inModal.inbound.settings.testseed.length < 4)
                        ) {
                            inModal.inbound.settings.testseed = [900, 500, 900, 256];
                        }
                    }
                },
                deep: true,
            },
        },
        methods: {
            streamNetworkChange() {
                if (!inModal.inbound.canEnableTls()) {
                    this.inModal.inbound.stream.security = "none";
                }
                if (!inModal.inbound.canEnableReality()) {
                    this.inModal.inbound.reality = false;
                }
                if (
                    this.inModal.inbound.protocol == Protocols.VLESS &&
                    !inModal.inbound.canEnableTlsFlow()
                ) {
                    this.inModal.inbound.settings.vlesses.forEach((client) => {
                        client.flow = "";
                    });
                }
                if (inModal.inbound.stream.network != "kcp") {
                    inModal.inbound.stream.finalmask.udp = [];
                }
            },
            SSMethodChange() {
                this.inModal.inbound.settings.password =
                    RandomUtil.randomShadowsocksPassword(
                        this.inModal.inbound.settings.method,
                    );

                if (this.inModal.inbound.isSSMultiUser) {
                    if (this.inModal.inbound.settings.shadowsockses.length == 0) {
                        this.inModal.inbound.settings.shadowsockses = [
                            new Inbound.ShadowsocksSettings.Shadowsocks(),
                        ];
                    }
                    if (!this.inModal.inbound.isSS2022) {
                        this.inModal.inbound.settings.shadowsockses.forEach((client) => {
                            client.method = this.inModal.inbound.settings.method;
                        });
                    } else {
                        this.inModal.inbound.settings.shadowsockses.forEach((client) => {
                            client.method = "";
                        });
                    }
                    this.inModal.inbound.settings.shadowsockses.forEach((client) => {
                        client.password = RandomUtil.randomShadowsocksPassword(
                            this.inModal.inbound.settings.method,
                        );
                    });
                } else {
                    if (this.inModal.inbound.settings.shadowsockses.length > 0) {
                        this.inModal.inbound.settings.shadowsockses = [];
                    }
                }
            },
            setDefaultCertData(index) {
                inModal.inbound.stream.tls.certs[index].certFile = app.defaultCert;
                inModal.inbound.stream.tls.certs[index].keyFile = app.defaultKey;
            },
            async getNewX25519Cert() {
                inModal.loading(true);
                const msg = await HttpUtil.get("/panel/api/server/getNewX25519Cert");
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.reality.privateKey = msg.obj.privateKey;
                inModal.inbound.stream.reality.settings.publicKey = msg.obj.publicKey;
            },
            clearX25519Cert() {
                this.inbound.stream.reality.privateKey = "";
                this.inbound.stream.reality.settings.publicKey = "";
            },
            async getNewmldsa65() {
                inModal.loading(true);
                const msg = await HttpUtil.get("/panel/api/server/getNewmldsa65");
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.reality.mldsa65Seed = msg.obj.seed;
                inModal.inbound.stream.reality.settings.mldsa65Verify = msg.obj.verify;
            },
            clearMldsa65() {
                this.inbound.stream.reality.mldsa65Seed = "";
                this.inbound.stream.reality.settings.mldsa65Verify = "";
            },
            randomizeRealityTarget() {
                if (typeof getRandomRealityTarget !== "undefined") {
                    const randomTarget = getRandomRealityTarget();
                    this.inbound.stream.reality.target = randomTarget.target;
                    this.inbound.stream.reality.serverNames = randomTarget.sni;
                }
            },
            async getNewEchCert() {
                inModal.loading(true);
                const msg = await HttpUtil.post("/panel/api/server/getNewEchCert", {
                    sni: inModal.inbound.stream.tls.sni,
                });
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.tls.echServerKeys = msg.obj.echServerKeys;
                inModal.inbound.stream.tls.settings.echConfigList =
                    msg.obj.echConfigList;
            },
            clearEchCert() {
                this.inbound.stream.tls.echServerKeys = "";
                this.inbound.stream.tls.settings.echConfigList = "";
            },
            async getNewVlessEnc() {
                inModal.loading(true);
                const msg = await HttpUtil.get("/panel/api/server/getNewVlessEnc");
                inModal.loading(false);

                if (!msg.success) {
                    return;
                }

                const auths = msg.obj.auths || [];
                const selected = inModal.inbound.settings.selectedAuth;
                const block = auths.find((a) => a.label === selected);

                if (!block) {
                    console.error("No auth block for", selected);
                    return;
                }

                inModal.inbound.settings.decryption = block.decryption;
                inModal.inbound.settings.encryption = block.encryption;
            },
            clearVlessEnc() {
                this.inbound.settings.decryption = "none";
                this.inbound.settings.encryption = "none";
                this.inbound.settings.selectedAuth = undefined;
            },
            // Vision Seed methods - must be in Vue methods for proper binding
            updateTestseed(index, value) {
                // Ensure testseed is initialized
                if (
                    !this.inbound.settings.testseed ||
                    !Array.isArray(this.inbound.settings.testseed)
                ) {
                    this.$set(this.inbound.settings, "testseed", [900, 500, 900, 256]);
                }
                // Ensure array has enough elements
                while (this.inbound.settings.testseed.length <= index) {
                    this.inbound.settings.testseed.push(0);
                }
                // Update value using Vue.set for reactivity
                this.$set(this.inbound.settings.testseed, index, value);
            },
            setRandomTestseed() {
                // Create new array with random values and use Vue.set for reactivity
                const newSeed = [
                    Math.floor(Math.random() * 1000),
                    Math.floor(Math.random() * 1000),
                    Math.floor(Math.random() * 1000),
                    Math.floor(Math.random() * 1000),
                ];
                this.$set(this.inbound.settings, "testseed", newSeed);
            },
            resetTestseed() {
                // Reset testseed to default values using Vue.set for reactivity
                this.$set(this.inbound.settings, "testseed", [900, 500, 900, 256]);
            },
        },
    });
</script>
{{end}}
