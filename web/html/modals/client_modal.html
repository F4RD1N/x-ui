{{define "modals/clientsModal"}}
<a-modal id="client-modal" v-model="clientModal.visible"
    :title="clientModal.title" @ok="clientModal.ok"
    :confirm-loading="clientModal.confirmLoading || clientModal.initializing || (inbound.isNative && inbound.settings.generating)" :closable="true"
    :ok-button-props="{ props: { disabled: clientModal.initializing || !client || (inbound.isNative && inbound.settings.generating) } }"
    :mask-closable="false"
    :class="themeSwitcher.currentTheme"
    :ok-text="clientModal.okText" cancel-text='{{ i18n "close" }}'>
    <template v-if="isEdit">
        <a-tag v-if="isExpiry || isTrafficExhausted" color="red"
            :style="{ marginBottom: '10px', display: 'block', textAlign: 'center' }">Account
            is (Expired|Traffic Ended) And Disabled</a-tag>
    </template>
    <template v-if="client">{{template "form/client"}}</template>
    <a-spin v-else-if="clientModal.initializing"></a-spin>
    <template v-else-if="inbound.isNative && inbound.settings.generationError">
      <a-alert type="error" :message="inbound.settings.generationError"></a-alert>
      <a-button @click="clientModal.initializeNativeClient()">Retry generation</a-button>
    </template>
</a-modal>
<script>

    const clientModal = {
        visible: false,
        confirmLoading: false,
        title: '',
        okText: '',
        isEdit: false,
        dbInbound: new DBInbound(),
        inbound: new Inbound(),
        clients: [],
        clientStats: [],
        oldClientId: "",
        index: null,
        clientIps: null,
        delayedStart: false,
        initializing: false,
        showToken: 0,
        ok() {
            if (clientModal.initializing || !clientModalApp.client || (clientModal.inbound.isNative && clientModal.inbound.settings.generating)) return;
            const compatibilityErrors = Inbound.compatibilityErrors(clientModal.inbound.protocol, [clientModalApp.client], clientModal.inbound.method);
            if (compatibilityErrors.length) {
                clientModalApp.$message.error(compatibilityErrors.join("; "));
                return;
            }
            if (clientModalApp.client instanceof Inbound.NativeClient && clientModalApp.client.validationErrors.length) {
                clientModalApp.$message.error(clientModalApp.client.validationErrors.join("; "));
                return;
            }
            if (clientModal.isEdit) {
                ObjectUtil.execute(clientModal.confirm, clientModalApp.client, clientModal.dbInbound.id, clientModal.oldClientId);
            } else {
                ObjectUtil.execute(clientModal.confirm, clientModalApp.client, clientModal.dbInbound.id);
            }
        },
        show({ title = '', okText = '{{ i18n "sure" }}', index = null, dbInbound = null, confirm = () => { }, isEdit = false }) {
            this.showToken++;
            this.initializing = false;
            this.visible = true;
            this.title = title;
            this.okText = okText;
            this.isEdit = isEdit;
            this.dbInbound = new DBInbound(dbInbound);
            this.inbound = Inbound.fromJson(dbInbound.toInbound().toJson());
            if (this.inbound.isNative) this.inbound.settings.rememberClientBindings();
            this.clients = this.inbound.clients;
            this.index = index === null ? this.clients.length : index;
            this.delayedStart = false;
            this.confirm = confirm;
            if (isEdit) {
                if (this.clients[index].expiryTime < 0) {
                    this.delayedStart = true;
                }
                this.oldClientId = this.getClientId(dbInbound.protocol, this.clients[index]);
            } else {
                if (this.inbound.isNative) {
                    this.clientStats = null;
                    this.initializeNativeClient();
                    return;
                }
                this.addClient(this.inbound, this.clients);
            }
            this.clientStats = this.dbInbound.clientStats.find(row => row.email === this.clients[this.index].email);
            this.confirm = confirm;
        },  
        async initializeNativeClient() {
            if (!this.visible || this.isEdit || !this.inbound.isNative || this.initializing) return false;
            const token = this.showToken;
            const inbound = this.inbound;
            this.initializing = true;
            try {
                const client = await inbound.settings.addGeneratedClient();
                if (this.showToken !== token || this.inbound !== inbound || !this.visible) return false;
                if (!client) return false;
                this.index = this.clients.indexOf(client);
                this.clientStats = null;
                return true;
            } finally {
                if (this.showToken === token && this.inbound === inbound) this.initializing = false;
            }
        },
        getClientId(protocol, client) {
            if (Inbound.NativeSettings.supports(protocol)) return Inbound.nativeClientId(protocol, client);
            switch (protocol) {
                case Protocols.TROJAN: return client.password;
                case Protocols.SHADOWSOCKS: return client.email;
                case Protocols.HYSTERIA: return client.auth;
                default: return client.id;
            }
        },
        addClient(inbound, clients) {
            if (inbound.isNative) return clients.push(inbound.settings.newClient());
            switch (inbound.protocol) {
                case Protocols.VMESS: return clients.push(new Inbound.VmessSettings.VMESS());
                case Protocols.VLESS: return clients.push(new Inbound.VLESSSettings.VLESS());
                case Protocols.TROJAN: return clients.push(new Inbound.TrojanSettings.Trojan());
                case Protocols.SHADOWSOCKS: {
                    const client = new Inbound.ShadowsocksSettings.Shadowsocks(clients[0].method, RandomUtil.randomShadowsocksPassword(inbound.settings.method));
                    if (inbound.settings.uuidIdentityKeys === true) { client.uuidIdentityKeys = true; client._uuidIdentityKeysPresent = true; }
                    return clients.push(client);
                }
                case Protocols.HYSTERIA: return clients.push(new Inbound.HysteriaSettings.Hysteria());
                default: return null;
            }
        },
        close() {
            clientModal.showToken++;
            clientModal.initializing = false;
            clientModal.visible = false;
            clientModal.loading(false);
        },
        loading(loading=true) {
            clientModal.confirmLoading = loading;
        },
    };

    const clientModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#client-modal',
        data: {
            clientModal,
            get inbound() {
                return this.clientModal.inbound;
            },
            get client() {
                return this.clientModal.clients[this.clientModal.index];
            },
            get clientStats() {
                return this.clientModal.clientStats;
            },
            get isEdit() {
                return this.clientModal.isEdit;
            },
            get datepicker() {
                return app.datepicker;
            },
            get isTrafficExhausted() {
                if (!this.clientStats) return false
                if (this.clientStats.total <= 0) return false
                if (this.clientStats.up + this.clientStats.down < this.clientStats.total) return false
                return true
            },
            get isExpiry() {
                return this.clientModal.isEdit && this.client.expiryTime >0 ? (this.client.expiryTime < new Date().getTime()) : false;
            },
            get delayedStart() {
                return this.clientModal.delayedStart;
            },
            set delayedStart(value) {
                this.clientModal.delayedStart = value;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0 ? this.client.expiryTime / -86400000 : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
        },
        methods: {
            async getDBClientIps(email) {
                const msg = await HttpUtil.post(`/panel/api/inbounds/clientIps/${email}`);
                if (!msg.success) {
                    document.getElementById("clientIPs").value = msg.obj;
                    return;
                }
                let ips = msg.obj;
                if (typeof ips === 'string' && ips.startsWith('[') && ips.endsWith(']')) {
                    try {
                        ips = JSON.parse(ips);
                        ips = Array.isArray(ips) ? ips.join("\n") : ips;
                    } catch (e) {
                        console.error('Error parsing JSON:', e);
                    }
                }
                document.getElementById("clientIPs").value = ips;
            },
            async clearDBClientIps(email) {
                try {
                    const msg = await HttpUtil.post(`/panel/api/inbounds/clearClientIps/${email}`);
                    if (!msg.success) {
                        return;
                    }
                    document.getElementById("clientIPs").value = "";
                } catch (error) {
                }
            },
            resetClientTraffic(email, dbInboundId, iconElement) {
                this.$confirm({
                    title: '{{ i18n "pages.inbounds.resetTraffic"}}',
                    content: '{{ i18n "pages.inbounds.resetTrafficContent"}}',
                    class: themeSwitcher.currentTheme,
                    okText: '{{ i18n "reset"}}',
                    cancelText: '{{ i18n "cancel"}}',
                    onOk: async () => {
                        iconElement.disabled = true;
                        const msg = await HttpUtil.postWithModal('/panel/api/inbounds/' + dbInboundId + '/resetClientTraffic/' + email);
                        if (msg.success) {
                            this.clientModal.clientStats.up = 0;
                            this.clientModal.clientStats.down = 0;
                        }
                        iconElement.disabled = false;
                    },
                })
            },
        },
    });

</script>
{{end}}
