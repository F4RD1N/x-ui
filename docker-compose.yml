services:
  x-ui:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: x-ui
    # hostname: yourhostname <- optional
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    # Each proxied connection holds two open files in a core; Docker's
    # default soft limit is 1024.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    tty: true
    network_mode: host
    restart: unless-stopped
